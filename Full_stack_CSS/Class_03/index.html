<!--compound selector: taking more than 2 id's for defining a class in css-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Selector</title>
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <h1>Compound Selector</h1>



    <div class ="card bg-green"> 
        <h2 class="text-underline">Hello</h2>
        <p>Lorem ipsum dolor sit amet consectetur.</p>
    </div>





    <div class ="card big">
        <h2>Hello</h2>
        <p class="text-underline">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    </div>




    <div class ="big bg-green">
        <h2>Hello</h2>
    <p>Lorem ipsum dolor sit amet consectetur.</p> 
    </div>

</body>
</html>



<!-- user agent(i.e. browser) < inheritance< * < element/tag < class < id < inline < ! important  -->
