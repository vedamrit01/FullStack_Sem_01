<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    
    <form method="post">
        <h3>Choose your Favourite colour:</h3>


        <input type="radio" name="any" id="white" value="white">
        <label for="white">white</label>

        <input type="radio" name="any" id="blue" value="blue">
        <label for="blue">blue</label>

        <input type="radio" name="any" id="pink" value="pink">
        <label for="pink">pink</label>


        <h3>Choose your Favourite sport:</h3>

        <input type="radio" name="other" id="cricket" value="cricket">
        <label for="cricket">cricket</label>

        <input type="radio" name="other" id="basketball" value="basketball">
        <label for="basketball">basketball</label>

        <input type="radio" name="other" id="badminton" value="badminton">
        <label for="badminton">badminton</label>
        <br>
        <br>

        <button type="submit" >Submit</button>








    </form>
</body>
</html>
