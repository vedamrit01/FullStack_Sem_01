<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Forms</title>
</head>
<body>
    <h2> We will learn forms today.</h2>
    <div>




    </div>
    <h3><i>  CR Application Form: </i></h3>


 <form action="/Full_stack_HTML/Lab_03/submission.html" method="get">
        <label for="name">   Enter your name:    </label>
        <input 
         type="text" 
         placeholder="Enter your Name"
         id="name" 
         name="name"
         required
         minlength="3"
         maxlength="10"/> <br> 
        
        <br />


        <label> Enter your image:  </label>
        <input 
         type="image"
         placeholder="Enter your image"/><br>

       <br />

        <label> Enter your age: </label>
        <input 
        type="number" 
        placeholder="Enter your age" 
        name="age"
        required/><br>

       <br />  

        <label for="date"> Enter DOB: </label>
        <input 
        type="date"  
        id="date"  
        name="Date" /> <br>

        <br />


    
        <label for="colour" >Enter your fav colour:</label>
        <input 
        type="color" 
        id="colour" 
        name="Colour"
        required /><br>

        <br />

        <label for="email"> Enter you eamil:</label>
        <input 
         type="email"
         id="email"  
         name="Email"
         required/><br>

        <br />

        <label for="pass">Enter you password:  </label>
        <input 
        type="password" 
        id="pass" 
        name="Password"
        required
        minlength="12"/><br>

        <button type="submit"> Submit Form</button><br>
        <button type="reset"> Reset</button>
    </form>
</body>
</html>
